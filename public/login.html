<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta name="HandheldFriendly" content="true" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <!-- 공통 CSS 먼저 로드 -->
        <link rel="stylesheet" type="text/css" href="/css/common.css" />
        <!-- 로그인 페이지 전용 CSS -->
        <link rel="stylesheet" type="text/css" href="/css/login.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.2/lottie.min.js"></script>
        <!-- Font Awesome 아이콘 추가 -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <title>Danny's community</title>
    </head>
    <body>
        <header class="head"><h1>Danny World</h1></header>
        <section class="warp">
            <div class="login-form-container">
                <h2 class="login-title">로그인</h2>
                <article class="login-article">
                    <div class="inputBox">
                        <label><strong>이메일</strong></label>
                        <i class="fas fa-envelope input-icon"></i>
                        <input
                            type="email"
                            name="id"
                            id="id"
                            placeholder="이메일을 입력하세요"
                            autocomplete="email"
                        />
                        <label id="helper-text-email" class="helper-text"></label>
                    </div>
                    <div class="inputBox">
                        <label><strong>비밀번호</strong></label>
                        <i class="fas fa-lock input-icon"></i>
                        <input
                            type="password"
                            name="pw"
                            id="pw"
                            placeholder="비밀번호를 입력하세요"
                            autocomplete="current-password"
                        />
                        <label id="helper-text-pass" class="helper-text"></label>
                    </div>
                    <div class="buttons">
                        <button
                            id="lottie-login"
                            class="submit-button"
                            onclick="login()"
                        >
                            로그인
                        </button>
                        <a id="sign" href="/signup">회원가입</a>
                        <div id="lottie-pop"></div>
                    </div>

                    <!-- 카카오 로그인 버튼 -->
                    <div class="kakao-login">
                        <a
                            href="https://kauth.kakao.com/oauth/authorize?client_id=460b66b189d9e6618b2397d5522cdcfa&redirect_uri=http://13.209.17.149/api/auth/kakao&response_type=code"
                            class="kakao-login-btn"
                        >
                            <img
                                src="/images/kakao_login_medium_wide.png"
                                alt="카카오로 로그인"
                            />
                        </a>
                    </div>
                </article>
            </div>
        </section>

        <script src="/js/login.js"></script>
    </body>
</html>
